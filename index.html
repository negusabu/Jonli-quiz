<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeo Quiz Pro — Talaba Ekrani</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#142868,#060c24);color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh}
.w{max-width:960px;margin:0 auto;padding:14px}

/* TOPBAR & SCOREBOARD */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(14,26,68,.92);backdrop-filter:blur(12px);padding:10px 14px;border-radius:14px;border:1px solid rgba(59,130,246,.35);margin-bottom:12px;flex-wrap:wrap}
.brand{font-size:18px;font-weight:bold;color:#FFC72C;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:20px;background:#1E3A8A;color:#FDE047;border:1px solid #60A5FA;font-weight:bold}
.userpill{font-size:12px;padding:4px 10px;border-radius:20px;background:#13245C;color:#7CFC9A;border:1px solid #1E8E4E;font-weight:bold}

.scorestrip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.scmini{background:rgba(17,33,86,.92);border:1px solid rgba(59,130,246,.45);border-radius:12px;padding:8px 6px;text-align:center}
.scmini.mine{border:2px solid #FFC72C;background:rgba(30,58,138,.95)}
.scmini .t{font-size:12px;color:#B8C4E0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scmini .v{font-size:20px;font-weight:bold;color:#FFC72C}

/* CARDS & FORMS */
.card{background:rgba(17,33,86,.88);backdrop-filter:blur(12px);border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid rgba(59,130,246,.35);box-shadow:0 8px 28px rgba(0,0,0,.25)}
.card h2{font-size:16px;color:#60A5FA;margin:0 0 10px}
input,select,textarea{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid rgba(59,130,246,.45);width:100%;margin:6px 0;background:#0c1842;color:#fff;font-size:15px}
button{font:inherit;color:#fff;background:#1B3180;border:none;border-radius:10px;padding:11px 15px;cursor:pointer;font-size:15px;transition:.2s}
button:hover{filter:brightness(1.1)}
button.gold{background:#FFC72C;color:#000;font-weight:bold;box-shadow:0 4px 14px rgba(255,199,44,.28)}
button.green{background:#1E8E4E;font-weight:bold}
button.red{background:#B3261E;font-weight:bold}
button:disabled{opacity:.45;cursor:default}

.q{font-size:20px;font-weight:bold;line-height:1.4;margin:8px 0 12px}
.ans{font-size:14px;color:#CBD5E1;line-height:1.55}
.aibox{background:rgba(12,24,66,.92);border-left:4px solid #8B5CF6;padding:12px;border-radius:10px;margin-top:10px;font-size:14px;line-height:1.5}
.msg{color:#FF8A80;font-weight:bold;margin-top:6px;font-size:14px}

/* OPTIONS (JEOPARDY / AUCTION / MILLIONAIRE) */
.optbtn{display:block;width:100%;text-align:left;padding:13px 16px;margin:8px 0;border-radius:12px;border:2px solid rgba(59,130,246,.45);background:rgba(12,24,66,.92);color:#fff;font-size:16px}
.optbtn.sel{background:#D97706;border-color:#FFC72C;color:#000;font-weight:bold}
.optbtn.ok{background:#1E8E4E;border-color:#7CFC9A;color:#fff;font-weight:bold}
.optbtn.bad{background:#B3261E;border-color:#FF8A80;color:#fff;font-weight:bold}
.optbtn.hid{opacity:.22;text-decoration:line-through;pointer-events:none}

/* JEOPARDY MINI BOARD */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cat{background:#1E63D6;text-align:center;font-size:11px;font-weight:bold;padding:7px 3px;border-radius:7px;min-height:34px;display:flex;align-items:center;justify-content:center}
.cell{background:rgba(14,27,72,.95);color:#FFC72C;font-weight:bold;font-size:17px;border:1px solid #1E63D6;border-radius:7px;padding:10px 0;text-align:center}
.cell.used{background:#2d3343;color:#6c7385;border-color:#2d3343;text-decoration:line-through}

/* KAHOOT / JONLI TEST */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
@media(max-width:560px){.kgrid{grid-template-columns:1fr}}
.kbtn{padding:18px 14px;border-radius:14px;font-weight:bold;font-size:17px;display:flex;align-items:center;gap:12px;color:#fff;border:3px solid rgba(255,255,255,.25);text-align:left;min-height:74px}
.kbtn.k0{background:#B91C1C}
.kbtn.k1{background:#1D4ED8}
.kbtn.k2{background:#B45309}
.kbtn.k3{background:#15803D}
.kbtn.picked{outline:4px solid #FFC72C;transform:scale(.99)}
.kbtn.dim{opacity:.35}
.kbtn.ok{outline:4px solid #7CFC9A}

/* PRO SLAYD STUDIO (STUDENT VIEW) */
.slide-stage{position:relative;border-radius:18px;padding:28px 30px;min-height:390px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 45px rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.16);overflow:hidden}
.slide-stage.theme-royal{background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 55%,#172554 100%);color:#fff}
.slide-stage.theme-emerald{background:linear-gradient(135deg,#022c22 0%,#065f46 55%,#064e3b 100%);color:#fff}
.slide-stage.theme-sunset{background:linear-gradient(135deg,#27102c 0%,#7c2d12 55%,#451a03 100%);color:#fff}
.slide-stage.theme-obsidian{background:linear-gradient(135deg,#09090b 0%,#18181b 55%,#27272a 100%);color:#fafafa}
.slide-stage.theme-minimal{background:linear-gradient(135deg,#f8fafc 0%,#e2e8f0 100%);color:#0f172a;border-color:#cbd5e1}
.slide-stage:fullscreen{border-radius:0;padding:48px 60px;width:100vw;height:100vh}

.sl-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sl-badge{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:bold;letter-spacing:1px;background:rgba(255,199,44,.2);color:#FFC72C;border:1px solid rgba(255,199,44,.45)}
.theme-minimal .sl-badge{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
.sl-num{font-size:14px;opacity:.75;font-weight:bold}
.sl-title{font-size:26px;font-weight:bold;line-height:1.25;margin:14px 0 8px}
.slide-stage:fullscreen .sl-title{font-size:44px}
.sl-sub{font-size:16px;opacity:.86;line-height:1.45;margin-bottom:14px}
.slide-stage:fullscreen .sl-sub{font-size:22px}
.sl-bullets{margin:8px 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.sl-bullets li{background:rgba(255,255,255,.08);padding:11px 14px;border-radius:12px;border-left:4px solid #FFC72C;font-size:16px;line-height:1.45}
.theme-minimal .sl-bullets li{background:rgba(15,23,42,.06);border-left-color:#2563eb}
.slide-stage:fullscreen .sl-bullets li{font-size:22px;padding:15px 20px}
.sl-split{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:stretch}
@media(max-width:680px){.sl-split{grid-template-columns:1fr}}
.sl-callout{background:rgba(255,199,44,.14);border:1px solid rgba(255,199,44,.45);border-radius:14px;padding:16px;display:flex;flex-direction:column;justify-content:center}
.theme-minimal .sl-callout{background:#dbeafe;border-color:#93c5fd;color:#1e3a8a}
.sl-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.sl-statbox{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:14px;text-align:center}
.theme-minimal .sl-statbox{background:#fff;border-color:#cbd5e1}
.sl-statval{font-size:26px;font-weight:bold;color:#FFC72C}
.theme-minimal .sl-statval{color:#1d4ed8}
.sl-statlbl{font-size:13px;opacity:.85;margin-top:4px}
.sl-quote{font-size:20px;font-style:italic;line-height:1.45;padding:18px;border-left:6px solid #FFC72C;background:rgba(255,255,255,.07);border-radius:12px;margin:10px 0}
.sl-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.75;border-top:1px solid rgba(255,255,255,.14);padding-top:10px;margin-top:14px}
.theme-minimal .sl-foot{border-top-color:#cbd5e1}

/* CLASSIC TEST */
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.qpill{min-width:36px;height:36px;padding:0 8px;border-radius:8px;font-size:13px;font-weight:bold;background:rgba(12,24,66,.95);border:1px solid rgba(59,130,246,.45);color:#CBD5E1}
.qpill.answered{background:#1E3A8A;border-color:#60A5FA;color:#7CFC9A}
.qpill.current{background:#FFC72C;border-color:#FFC72C;color:#000}

.barwrap{background:rgba(12,24,66,.9);border-radius:8px;overflow:hidden;height:24px;margin:6px 0;position:relative}
.barfill{background:#2563EB;height:100%;transition:width .3s}
.bartxt{position:absolute;left:10px;top:3px;font-size:13px;font-weight:bold}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 6px;border-bottom:1px solid rgba(27,49,128,.6);font-size:14px;text-align:left}
</style></head>
<body><div class="w">

<!-- KIRISH OYNASI -->
<div id="loginbox">
  <div class="topbar">
    <div class="brand">⚡ JEO QUIZ PRO</div>
    <a href="/admin" style="color:#93C5FD;text-decoration:none;font-size:13px">Boshlovchi paneli →</a>
  </div>
  <div class="card" style="max-width:480px;margin:20px auto;border:2px solid #FFC72C">
    <h2 style="color:#FFC72C;font-size:19px">XONAGA QO‘SHILISH</h2>
    <div class="ans" style="margin-bottom:10px">O‘qituvchi bergan 4 xonali xona kodini va ismingizni kiriting:</div>
    <label style="font-size:13px;color:#93C5FD">Xona kodi:</label>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="inroom" placeholder="0000" maxlength="6" style="font-size:20px;font-weight:bold;letter-spacing:3px;text-align:center">
      <button onclick="checkRoomInfo()" style="white-space:nowrap">Tekshirish</button>
    </div>
    <div id="roomtopicinfo" style="font-size:13px;color:#7CFC9A;margin-bottom:6px"></div>

    <label style="font-size:13px;color:#93C5FD">Ism-familiyangiz:</label>
    <input id="inname" placeholder="Masalan: Jasurbek Alimov">

    <label style="font-size:13px;color:#93C5FD">Jamoangiz (agar jamoaviy o‘yin bo‘lsa):</label>
    <select id="inteam">
      <option value="">Jamoasiz (shaxsiy ishtirok)</option>
      <option value="0">1-jamoa</option>
      <option value="1">2-jamoa</option>
      <option value="2">3-jamoa</option>
      <option value="3">4-jamoa</option>
    </select>

    <button class="gold" style="width:100%;margin-top:12px;padding:14px;font-size:16px" onclick="doLogin()">Kirish ➔</button>
    <div id="loginmsg" class="msg"></div>
  </div>
</div>

<!-- ASOSIY TALABA EKRANI -->
<div id="appbox" style="display:none">
  <div class="topbar">
    <div class="brand">
      <span>⚡ JEO QUIZ</span>
      <span id="toproom" class="pill">#0000</span>
      <span id="topuser" class="userpill">👤 Talaba</span>
    </div>
    <button onclick="logoutRoom()" style="padding:7px 11px;font-size:13px;background:#13245C">Chiqish</button>
  </div>

  <div id="scorestrip" class="scorestrip"></div>
  <div id="mainstage"></div>
</div>

</div>
<script>
const L = ['A','B','C','D'];
const SHAPES = ['▲','◆','●','■'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ru-RU');

const urlParams = new URLSearchParams(window.location.search);
let curRoom = urlParams.get('room') || sessionStorage.getItem('st_room') || '0000';
let myName = sessionStorage.getItem('st_name') || '';
let myTeam = sessionStorage.getItem('st_team');
myTeam = (myTeam !== null && myTeam !== '' && myTeam !== 'null') ? Number(myTeam) : null;

let S = null;
let lastJeoQKey = '';
let lastAucRoundKey = '';
let ctState = { key: '', answers: [], curIdx: 0, startTime: 0, submittedResult: null, submitting: false };
let ctTimerInterval = null;

document.getElementById('inroom').value = curRoom;
if (myName) document.getElementById('inname').value = myName;

async function checkRoomInfo(){
  const code = document.getElementById('inroom').value.trim() || '0000';
  const info = document.getElementById('roomtopicinfo');
  const r = await fetch(`/api/check_room?room=${encodeURIComponent(code)}`, {cache:'no-store'});
  const j = await r.json();
  if (!r.ok){
    info.style.color = '#FF8A80';
    info.textContent = j.error || 'Xona topilmadi';
    return;
  }
  info.style.color = '#7CFC9A';
  info.textContent = `✔ Xona #${j.room} topildi — Mavzu: ${j.topic_title}`;
  // Load team names for this room
  const sr = await fetch(`/api/state?room=${encodeURIComponent(code)}`, {cache:'no-store'});
  if (sr.ok){
    const st = await sr.json();
    const sel = document.getElementById('inteam');
    const prev = sel.value;
    sel.innerHTML = `<option value="">Jamoasiz (shaxsiy ishtirok)</option>` +
      (st.teams || []).map((t, i) => `<option value="${i}">${esc(t)}</option>`).join('');
    sel.value = prev;
  }
}

async function doLogin(){
  const code = document.getElementById('inroom').value.trim() || '0000';
  const name = document.getElementById('inname').value.trim();
  const tv = document.getElementById('inteam').value;
  const msg = document.getElementById('loginmsg');
  if (!name){ msg.textContent = 'Iltimos, ismingizni kiriting'; return; }

  const teamVal = tv === '' ? null : Number(tv);
  const r = await fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({room: code, name, team: teamVal})
  });
  const j = await r.json();
  if (!r.ok){ msg.textContent = j.error || 'Kirishda xatolik'; return; }

  msg.textContent = '';
  curRoom = code;
  myName = name;
  myTeam = teamVal;
  sessionStorage.setItem('st_room', curRoom);
  sessionStorage.setItem('st_name', myName);
  sessionStorage.setItem('st_team', myTeam === null ? '' : String(myTeam));
  if (window.history.replaceState) window.history.replaceState({}, '', '/?room=' + encodeURIComponent(curRoom));

  document.getElementById('loginbox').style.display = 'none';
  document.getElementById('appbox').style.display = 'block';
  poll();
}

function logoutRoom(){
  myName = '';
  sessionStorage.removeItem('st_name');
  sessionStorage.removeItem('st_team');
  document.getElementById('appbox').style.display = 'none';
  document.getElementById('loginbox').style.display = 'block';
  checkRoomInfo();
}

async function poll(){
  if (!myName) return;
  try {
    const r = await fetch(`/api/state?room=${encodeURIComponent(curRoom)}`, {cache:'no-store'});
    if (!r.ok) return;
    S = await r.json();
    render();
  } catch (e) {}
}

function render(){
  if (!S || !myName) return;
  document.getElementById('toproom').textContent = 'Xona #' + S.room;
  const teamLbl = (myTeam !== null && S.teams[myTeam]) ? ` • ${S.teams[myTeam]}` : '';
  document.getElementById('topuser').textContent = `👤 ${myName}${teamLbl}`;

  const strip = document.getElementById('scorestrip');
  if (S.mode === 'slides' || S.mode === 'classic_test'){
    strip.style.display = 'none';
  } else {
    strip.style.display = 'grid';
    strip.innerHTML = S.teams.map((t, i) =>
      `<div class="scmini ${myTeam === i ? 'mine' : ''}"><div class="t">${esc(t)}</div><div class="v">${S.scores[i]}</div></div>`
    ).join('');
  }

  const m = S.mode || 'jeopardy';
  if (m === 'slides') renderSlidesStudent();
  else if (m === 'classic_test') renderClassicTestStudent();
  else if (m === 'kahoot') renderKahootStudent();
  else if (m === 'millionaire') renderMillionaireStudent();
  else if (m === 'auction') renderAuctionStudent();
  else if (m === 'bomb') renderBombStudent();
  else renderJeopardyStudent();
}

/* ================= 1. JEO QUIZ (5x5) ================= */
function renderJeopardyStudent(){
  const stage = document.getElementById('mainstage');
  if (S.cur !== null && S.question){
    const q = S.question;
    const qKey = `${S.cur}_${q.q}`;
    const myChoice = myTeam !== null ? (S.answers || {})[myTeam] : undefined;

    if (q.opts && q.opts.length){
      lastJeoQKey = '';
      let x = `<div class="card" style="border:2px solid #FFC72C">
        <div style="font-size:13px;color:#93C5FD;font-weight:bold">${esc(q.cat)} • ${q.pts} ball</div>
        <div class="q">${esc(q.q)}</div>`;

      q.opts.forEach((opt, i) => {
        let cls = 'optbtn';
        if (S.revealed){
          if (i === q.c) cls += ' ok';
          else if (i === myChoice) cls += ' bad';
        } else if (i === myChoice){
          cls += ' sel';
        }
        const dis = (S.revealed || myTeam === null) ? 'disabled' : '';
        x += `<button class="${cls}" ${dis} onclick="sendJeoChoice(${i})">${L[i]}) ${esc(opt)}</button>`;
      });

      if (myTeam === null && !S.revealed){
        x += `<div class="aibox" style="border-left-color:#FFC72C">Siz jamoa tanlamagansiz. Ekranda savolni kuzating yoki yuqoridan chiqib jamoa tanlang.</div>`;
      } else if (!S.revealed && myChoice !== undefined){
        x += `<div class="ans" style="color:#7CFC9A;margin-top:8px">✔ ${esc(S.teams[myTeam])} javobi tanlandi: <b>${L[myChoice]}</b></div>`;
      }
      if (S.revealed && q.exp) x += `<div class="aibox"><b>Izoh:</b> ${esc(q.exp)}</div>`;
      if (S.ai_note) x += `<div class="aibox"><b>AI misoli:</b> ${esc(S.ai_note)}</div>`;
      x += `</div>`;
      stage.innerHTML = x;
    } else {
      // Open-ended text question (keep textarea intact across polls)
      if (lastJeoQKey !== qKey){
        lastJeoQKey = qKey;
        const prevTxt = myTeam !== null ? ((S.text_answers || {})[myTeam] || '') : '';
        stage.innerHTML = `<div class="card" style="border:2px solid #FFC72C">
          <div style="font-size:13px;color:#93C5FD;font-weight:bold">${esc(q.cat)} • ${q.pts} ball (Yozma savol)</div>
          <div class="q">${esc(q.q)}</div>
          ${myTeam !== null ? `
            <textarea id="jeotxt" rows="3" placeholder="Jamoangiz javobini yozing...">${esc(prevTxt)}</textarea>
            <button class="gold" style="width:100%" onclick="sendJeoText()">Javobni yuborish</button>
          ` : `<div class="aibox">Yozma javob yuborish uchun jamoaga birikkan bo‘lishingiz kerak.</div>`}
          <div id="jeotxtstatus"></div>
        </div>`;
      }
      const stDiv = document.getElementById('jeotxtstatus');
      if (stDiv){
        let extra = '';
        if (myTeam !== null && (S.text_answers || {})[myTeam]){
          extra += `<div class="ans" style="color:#7CFC9A;margin-top:8px">✔ Yuborilgan javob: <b>${esc(S.text_answers[myTeam])}</b></div>`;
        }
        if (S.revealed){
          extra += `<div class="aibox" style="border-left-color:#1E8E4E"><b>To‘g‘ri javob:</b> ${esc(q.ans)}<br>${esc(q.exp || '')}</div>`;
        }
        stDiv.innerHTML = extra;
      }
    }
    return;
  }

  lastJeoQKey = '';
  const cats = S.cats || [];
  let h = `<div class="card">
    <h2>🟦 ${esc(S.topic_title || 'JEO QUIZ')} — Boshlovchi katakcha tanlashini kuting...</h2>
    <div class="board">` + cats.map(c => `<div class="cat">${esc(c)}</div>`).join('');
  for (let r = 0; r < 5; r++){
    for (let c = 0; c < 5; c++){
      const idx = c * 5 + r;
      h += `<div class="cell ${S.used[idx] ? 'used' : ''}">${(r + 1) * 100}</div>`;
    }
  }
  h += `</div></div>`;
  stage.innerHTML = h;
}

async function sendJeoChoice(choice){
  if (myTeam === null) return;
  await fetch('/api/answer', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({room: curRoom, team: myTeam, choice})
  });
  poll();
}

async function sendJeoText(){
  if (myTeam === null) return;
  const el = document.getElementById('jeotxt');
  if (!el) return;
  await fetch('/api/answer', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({room: curRoom, team: myTeam, text: el.value.trim()})
  });
  poll();
}

/* ================= 2. MILLIONER ================= */
function renderMillionaireStudent(){
  const stage = document.getElementById('mainstage');
  const m = S.mil;
  if (!m){
    stage.innerHTML = `<div class="card"><h2>💎 KIM MILLIONER BO‘LISHNI XOHLAYDI?</h2><div class="ans">O‘yin boshlanishini kuting...</div></div>`;
    return;
  }
  const q = m.question;
  const curPrize = (m.prizes || [])[m.step] || 0;
  let x = `<div class="card" style="border:2px solid #FFC72C">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:8px">
      <span>💎 <b>${esc(m.player)}</b></span>
      <span>${m.step + 1}/15-savol • <b style="color:#7CFC9A">${fmt(curPrize)} ball</b></span>
    </div>
    <div style="font-size:13px;color:#93C5FD">${esc(q.cat)}</div>
    <div class="q">${esc(q.q)}</div>`;

  q.opts.forEach((opt, i) => {
    const isHid = (m.hidden_opts || []).includes(i);
    let cls = 'optbtn' + (isHid ? ' hid' : '');
    if (m.revealed){
      if (i === q.c) cls += ' ok';
      else if (i === m.selected) cls += ' bad';
    } else if (i === m.selected){
      cls += ' sel';
    }
    x += `<button class="${cls}" disabled>${L[i]}) ${esc(opt)}</button>`;
  });

  if (m.audience_open){
    x += `<div class="aibox" style="border-left-color:#FFC72C">
      <b style="color:#FFC72C">📊 GURUH YORDAMI OCHIQ! O‘z variantingizni bosing:</b>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">` +
      [0,1,2,3].map(i => {
        if ((m.hidden_opts || []).includes(i)) return '';
        return `<button class="gold" onclick="voteMil(${i})">${L[i]} varianti</button>`;
      }).join('') + `</div></div>`;
  }

  if (m.vote_total > 0){
    x += `<div class="aibox"><b>Guruh ovozi (${m.vote_total} ta):</b>`;
    for (let i = 0; i < 4; i++){
      if ((m.hidden_opts || []).includes(i)) continue;
      const cnt = (m.vote_counts || [])[i] || 0;
      const pct = Math.round(cnt * 100 / m.vote_total);
      x += `<div class="barwrap"><div class="barfill" style="width:${pct}%"></div><div class="bartxt">${L[i]}: ${pct}%</div></div>`;
    }
    x += `</div>`;
  }

  if (m.ai_hint) x += `<div class="aibox"><b>🤖 Gemini AI maslahati:</b><br>${esc(m.ai_hint)}</div>`;
  if (m.revealed && q.exp) x += `<div class="ans" style="margin-top:8px"><b>Izoh:</b> ${esc(q.exp)}</div>`;
  if (m.status === 'won') x += `<div class="aibox" style="border-color:#FFC72C;color:#FFC72C;font-weight:bold">🏆 1 000 000 BALL YUTILDI!</div>`;
  else if (m.status === 'lost') x += `<div class="aibox" style="border-color:#B3261E;color:#FF8A80;font-weight:bold">O‘yin tugadi. Kafolatlangan yutuq: ${fmt(m.won)} ball.</div>`;
  else if (m.status === 'walked') x += `<div class="aibox" style="border-color:#1E8E4E;color:#7CFC9A;font-weight:bold">${esc(m.player)} ${fmt(m.won)} ball bilan to‘xtadi!</div>`;

  x += `</div>`;
  stage.innerHTML = x;
}

/* ================= 3. AUKSION ================= */
function renderAuctionStudent(){
  const stage = document.getElementById('mainstage');
  const a = S.auc;
  if (!a){
    stage.innerHTML = `<div class="card"><h2>💰 AUKSION VA STAVKA</h2><div class="ans">Boshlovchi auksionni boshlashini kuting...</div></div>`;
    return;
  }

  const rKey = `${a.round}_${a.phase}`;
  let x = `<div class="card" style="border:2px solid #F59E0B">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:10px">
      <h2 style="color:#FBBF24;margin:0">💰 AUKSION — ${a.round}/${a.total_rounds}-RAUND</h2>
      <span>Bo‘lim: <b style="color:#7CFC9A">${esc(a.cat)}</b></span>
    </div>
    <table style="margin-bottom:12px"><tr><th>Jamoa</th><th style="text-align:right">Kapital</th><th style="text-align:right">Stavka</th></tr>` +
    S.teams.map((t, i) => {
      const bet = a.bets[String(i)];
      const d = (a.deltas || [])[i] || 0;
      const dTxt = a.phase === 'revealed' ? (d > 0 ? ` <b style="color:#7CFC9A">(+${d})</b>` : ` <b style="color:#FF8A80">(${d})</b>`) : '';
      return `<tr><td>${esc(t)} ${myTeam===i?'⭐':''}</td><td style="text-align:right;color:#FFC72C;font-weight:bold">${fmt(a.bank[i])}${dTxt}</td>
        <td style="text-align:right">${bet !== undefined ? fmt(bet) : '—'}</td></tr>`;
    }).join('') + `</table>`;

  if (a.phase === 'betting'){
    if (myTeam !== null){
      const myBank = a.bank[myTeam] || 1000;
      const curBet = a.bets[String(myTeam)];
      if (lastAucRoundKey !== rKey){
        lastAucRoundKey = rKey;
        const defVal = curBet !== undefined ? curBet : Math.max(10, Math.round(myBank * 0.2));
        x += `<div class="aibox" style="border-left-color:#F59E0B">
          <b>${esc(S.teams[myTeam])} kapitali: <span style="color:#FFC72C">${fmt(myBank)}</span></b>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">
            <button onclick="setAucBet(${Math.max(10, Math.round(myBank*0.1))})">10%</button>
            <button onclick="setAucBet(${Math.max(10, Math.round(myBank*0.25))})">25%</button>
            <button onclick="setAucBet(${Math.max(10, Math.round(myBank*0.5))})">50%</button>
            <button class="red" onclick="setAucBet(${myBank})">ALL-IN</button>
          </div>
          <div style="display:flex;gap:8px">
            <input id="aucbetinp" type="number" min="10" max="${myBank}" value="${defVal}" style="margin:0">
            <button class="gold" onclick="submitAucBet()">Stavka tikish</button>
          </div>
          <div id="aucbetstatus" style="margin-top:6px;color:#7CFC9A;font-size:13px"></div>
        </div>`;
        x += `</div>`;
        stage.innerHTML = x;
      } else {
        // Update table & status without destroying input
        const tbl = stage.querySelector('table');
        if (tbl){
          tbl.innerHTML = `<tr><th>Jamoa</th><th style="text-align:right">Kapital</th><th style="text-align:right">Stavka</th></tr>` +
            S.teams.map((t, i) => {
              const bet = a.bets[String(i)];
              return `<tr><td>${esc(t)} ${myTeam===i?'⭐':''}</td><td style="text-align:right;color:#FFC72C;font-weight:bold">${fmt(a.bank[i])}</td>
                <td style="text-align:right">${bet !== undefined ? fmt(bet) : '—'}</td></tr>`;
            }).join('');
        }
        const st = document.getElementById('aucbetstatus');
        if (st && curBet !== undefined) st.textContent = `✔ Tikilgan stavka: ${fmt(curBet)}`;
      }
      return;
    } else {
      x += `<div class="aibox">Jamoalar stavka tikishini kuting...</div>`;
    }
  } else if (a.question){
    lastAucRoundKey = '';
    const q = a.question;
    const myAns = myTeam !== null ? (a.answers || {})[String(myTeam)] : undefined;
    x += `<div class="q">${esc(q.q)}</div>`;
    q.opts.forEach((opt, i) => {
      let cls = 'optbtn';
      if (a.phase === 'revealed'){
        if (i === q.c) cls += ' ok';
        else if (i === myAns) cls += ' bad';
      } else if (i === myAns){
        cls += ' sel';
      }
      const dis = (a.phase !== 'question' || myTeam === null) ? 'disabled' : '';
      x += `<button class="${cls}" ${dis} onclick="submitAucAns(${i})">${L[i]}) ${esc(opt)}</button>`;
    });
    if (a.phase === 'revealed' && q.exp) x += `<div class="aibox"><b>Izoh:</b> ${esc(q.exp)}</div>`;
  }

  x += `</div>`;
  stage.innerHTML = x;
}

      ${myRec ? `<div class="aibox">Sizning o‘rningiz: <b style="color:#FFC72C">${myRank + 1}-o‘rin</b> • Jami: <b style="color:#7CFC9A">${fmt(myRec.pts)} ball</b> ${myRec.streak>=2?'🔥'+myRec.streak:''}</div>` : ''}

      </tr>`
    ).join('') + `</table></div>`;
    stage.innerHTML = x;
  }
}

/* ================= 7. ODDIY TEST (CLASSIC SELF-PACED TEST) ================= */
function renderClassicTestStudent(){
  const stage = document.getElementById('mainstage');
  const ct = S.classic_test;
  if (!ct || !ct.pool || !ct.pool.length){
    stage.innerHTML = `<div class="card"><h2>📝 ODDIY TEST</h2><div class="ans">O‘qituvchi testni boshlashini kuting...</div></div>`;
    return;
  }

  const testKey = `${ct.title}_${ct.total_q}_${ct.time_limit}`;
  if (ctState.key !== testKey){
    ctState = {
      key: testKey,
      answers: new Array(ct.pool.length).fill(null),
      curIdx: 0,
      startTime: Date.now(),
      submittedResult: null,
      submitting: false,
    };
  }

  // Check if server already has our submission
  const serverSub = (ct.submissions || {})[myName];
  if (serverSub && !ctState.submittedResult){
    ctState.submittedResult = serverSub;
  }

  // If submitted, render scorecard & detailed review
  if (ctState.submittedResult){
    const res = ctState.submittedResult;
    const mins = Math.floor(res.duration_sec / 60), secs = res.duration_sec % 60;
    const pColor = res.percent >= 80 ? '#7CFC9A' : (res.percent >= 60 ? '#FFC72C' : '#FF8A80');
    let x = `<div class="card" style="border:2px solid #10B981">
      <div style="text-align:center;padding:12px 0">
        <div style="font-size:14px;color:#6EE7B7;font-weight:bold">✅ TEST YAKUNLANDI — ${esc(ct.title)}</div>
        <div style="font-size:46px;font-weight:bold;color:${pColor};margin:8px 0">${res.percent}%</div>
        <div style="font-size:18px">To‘g‘ri javoblar: <b>${res.correct} / ${res.total}</b> • Ball: <b style="color:#FFC72C">${fmt(res.score)}</b></div>
        <div style="font-size:13px;color:#93C5FD;margin-top:4px">Sarflangan vaqt: ${mins} daqiqa ${secs} soniya</div>
      </div>`;

    if (res.review && res.review.length){
      x += `<div class="aibox" style="border-left-color:#10B981"><b>📋 Savollar bo‘yicha tahlil:</b>` +
        res.review.map((rv, idx) => {
          const uTxt = (rv.user_choice >= 0 && rv.opts[rv.user_choice]) ? `${L[rv.user_choice]}) ${esc(rv.opts[rv.user_choice])}` : 'Belgilanmagan';
          const cTxt = `${L[rv.correct_choice]}) ${esc(rv.opts[rv.correct_choice])}`;
          return `<div style="padding:10px 0;border-bottom:1px solid rgba(59,130,246,.22)">
            <div><b>${idx+1}. ${esc(rv.q)}</b></div>
            <div style="font-size:14px;margin-top:4px">
              Sizning javobingiz: <b style="color:${rv.is_correct?'#7CFC9A':'#FF8A80'}">${uTxt} ${rv.is_correct?'✔':'✘'}</b>
              ${!rv.is_correct ? `<br>To‘g‘ri javob: <b style="color:#7CFC9A">${cTxt}</b>` : ''}
            </div>
            ${rv.exp ? `<div style="font-size:13px;color:#CBD5E1;margin-top:3px">💡 ${esc(rv.exp)}</div>` : ''}
          </div>`;
        }).join('') + `</div>`;
    }
    x += `</div>`;
    stage.innerHTML = x;
    return;
  }

  if (!ct.active){
    stage.innerHTML = `<div class="card" style="border:2px solid #EF4444;text-align:center">
      <h2 style="color:#FF8A80">⏹ TEST VAQTI YAKUNLANDI</h2>
      <div class="ans">O‘qituvchi ushbu test uchun javoblar qabulini yopdi.</div>
    </div>`;
    return;
  }

  // Active self-paced test UI
  const idx = ctState.curIdx;
  const q = ct.pool[idx];
  const answeredCount = ctState.answers.filter(v => v !== null).length;

  let timerHtml = '';
  if (ct.time_limit > 0){
    const elapsed = Math.floor((Date.now() - ctState.startTime) / 1000);
    const left = Math.max(0, ct.time_limit * 60 - elapsed);
    const mm = String(Math.floor(left / 60)).padStart(2, '0');
    const ss = String(left % 60).padStart(2, '0');
    timerHtml = `<span id="cttimerpill" style="font-size:18px;font-weight:bold;color:${left<=30?'#FF8A80':'#FFC72C'}">⏱ ${mm}:${ss}</span>`;
    if (left <= 0 && !ctState.submitting){
      submitClassicTest(true);
      return;
    }
  }

  let x = `<div class="card" style="border:2px solid #10B981">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">
      <div>
        <h2 style="color:#6EE7B7;margin:0">📝 ${esc(ct.title)}</h2>
        <div style="font-size:13px;color:#CBD5E1">Belgilangan: <b>${answeredCount} / ${ct.pool.length}</b></div>
      </div>
      ${timerHtml}
    </div>

    <div class="qnav">` +
    ct.pool.map((_, i) => {
      const cls = 'qpill' + (i === idx ? ' current' : (ctState.answers[i] !== null ? ' answered' : ''));
      return `<button class="${cls}" onclick="ctGo(${i})">${i+1}</button>`;
    }).join('') + `</div>

    <div style="font-size:13px;color:#93C5FD">${idx + 1}-savol • ${esc(q.cat)} (${q.pts} ball)</div>
    <div class="q">${esc(q.q)}</div>`;

  q.opts.forEach((opt, i) => {
    const isSel = ctState.answers[idx] === i;
    x += `<button class="optbtn ${isSel ? 'sel' : ''}" onclick="ctPick(${i})">${L[i]}) ${esc(opt)}</button>`;
  });

  x += `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px">
    <div style="display:flex;gap:8px">
      <button ${idx<=0?'disabled':''} onclick="ctGo(${idx-1})">◀ Oldingi</button>
      <button ${idx>=ct.pool.length-1?'disabled':''} onclick="ctGo(${idx+1})">Keyingi ▶</button>
    </div>
    <button class="green" ${ctState.submitting?'disabled':''} onclick="submitClassicTest(false)">✅ Testni topshirish (${answeredCount}/${ct.pool.length})</button>
  </div></div>`;

  stage.innerHTML = x;
}

function ctGo(i){
  ctState.curIdx = i;
  renderClassicTestStudent();
}

function ctPick(choice){
  ctState.answers[ctState.curIdx] = choice;
  renderClassicTestStudent();
}

async function submitClassicTest(auto){
  if (ctState.submitting || ctState.submittedResult) return;
  const unanswered = ctState.answers.filter(v => v === null).length;
  if (!auto && unanswered > 0){
    if (!confirm(`Hali ${unanswered} ta savol belgilanmagan. Baribir testni topshirasizmi?`)) return;
  }
  ctState.submitting = true;
  renderClassicTestStudent();

  const durSec = Math.max(1, Math.round((Date.now() - ctState.startTime) / 1000));
  const payloadAns = ctState.answers.map(v => v === null ? -1 : v);
  const r = await fetch('/api/classic_test_submit', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      room: curRoom,
      name: myName,
      team: myTeam,
      answers: payloadAns,
      duration_sec: durSec
    })
  });
  const j = await r.json();
  ctState.submitting = false;
  if (!r.ok){
    alert(j.error || 'Topshirishda xatolik yuz berdi');
    renderClassicTestStudent();
    return;
  }
  ctState.submittedResult = j.result;
  renderClassicTestStudent();
}

// Init
checkRoomInfo();
if (myName){
  document.getElementById('loginbox').style.display = 'none';
  document.getElementById('appbox').style.display = 'block';
  poll();
}
setInterval(poll, 900);
</script>
</body></html>

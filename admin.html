<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeo Quiz Pro — Boshlovchi Paneli</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#142868,#060c24);color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh}
.w{max-width:1180px;margin:0 auto;padding:12px}

/* YAGONA IXCHAM TOPBAR */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(14,26,68,.95);padding:10px 14px;border-radius:14px;border:1px solid rgba(59,130,246,.35);margin-bottom:10px;flex-wrap:wrap}
.brand{font-size:17px;font-weight:bold;color:#FFC72C;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;padding:3px 9px;border-radius:20px;background:#1E3A8A;color:#FDE047;border:1px solid #60A5FA;font-weight:bold}
.aipill{font-size:12px;padding:3px 9px;border-radius:20px;background:#13245C;color:#7CFC9A;border:1px solid #1E8E4E;font-weight:bold}
.topacts{display:flex;gap:6px;flex-wrap:wrap}
.topacts button{padding:7px 11px;font-size:13px;border-radius:9px}

/* SOZLAMALAR TORTMASI (YIG'ILUVCHAN) */
.drawer{display:none;background:rgba(14,26,68,.96);border:1px solid rgba(96,165,250,.4);border-radius:12px;padding:10px;margin-bottom:10px;gap:6px;flex-wrap:wrap}
.drawer.open{display:flex}
.drawer button{padding:8px 12px;font-size:13px;background:#162c70}

/* JAMOA BALLARI */
.scorestrip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
@media(max-width:650px){.scorestrip{grid-template-columns:repeat(2,1fr)}}
.scmini{background:rgba(17,33,86,.92);border:1px solid rgba(59,130,246,.45);border-radius:12px;padding:8px;text-align:center}
.scmini .t{font-size:12px;color:#B8C4E0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scmini .v{font-size:20px;font-weight:bold;color:#FFC72C;margin:2px 0}

/* CARDS & FORMS */
.card{background:rgba(17,33,86,.9);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid rgba(59,130,246,.35)}
.card h2{font-size:15px;color:#60A5FA;margin:0 0 10px}
input,select,textarea{font:inherit;padding:9px 11px;border-radius:9px;border:1px solid rgba(59,130,246,.45);width:100%;margin:4px 0;background:#0c1842;color:#fff;font-size:14px}
button{font:inherit;color:#fff;background:#1B3180;border:none;border-radius:9px;padding:9px 13px;cursor:pointer;font-size:14px}
button:hover{filter:brightness(1.1)}
button.gold{background:#FFC72C;color:#000;font-weight:bold}
button.green{background:#1E8E4E;font-weight:bold}
button.red{background:#B3261E;font-weight:bold}
button.purple{background:#6D28D9;font-weight:bold}
button:disabled{opacity:.45;cursor:default}

.hubgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.hubcard{background:rgba(12,24,66,.95);border:1px solid rgba(59,130,246,.45);border-radius:14px;padding:14px;cursor:pointer;text-align:left}
.hubcard:hover{border-color:#FFC72C}
.hubcard .ic{font-size:26px;margin-bottom:4px}
.hubcard .tt{font-size:16px;font-weight:bold;color:#FFC72C}
.hubcard .ds{font-size:13px;color:#CBD5E1;margin-top:4px;line-height:1.4}

.q{font-size:19px;font-weight:bold;line-height:1.4;margin:8px 0 10px}
.ans{font-size:14px;color:#CBD5E1;line-height:1.5}
.aibox{background:rgba(12,24,66,.92);border-left:4px solid #8B5CF6;padding:10px 12px;border-radius:9px;margin-top:8px;font-size:14px}
.opt{padding:10px 12px;border-radius:9px;border:1px solid rgba(59,130,246,.45);background:rgba(12,24,66,.9);margin:6px 0;font-size:15px}
.opt.ok{background:#1E8E4E;border-color:#7CFC9A;font-weight:bold}
.opt.bad{background:#B3261E;border-color:#FF8A80}
.opt.hid{opacity:.25;text-decoration:line-through}

/* JEOPARDY 5x5 */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cat{background:#1E63D6;text-align:center;font-size:12px;font-weight:bold;padding:8px 4px;border-radius:8px;min-height:38px;display:flex;align-items:center;justify-content:center}
.cell{background:rgba(14,27,72,.95);color:#FFC72C;font-weight:bold;font-size:18px;border:1px solid #1E63D6;border-radius:8px;padding:12px 0;text-align:center}
.cell.used{background:#2d3343;color:#6c7385;border-color:#2d3343;text-decoration:line-through}

/* PRO SLAYD STUDIO */
.slide-stage{position:relative;border-radius:16px;padding:24px 26px;min-height:360px;display:flex;flex-direction:column;justify-content:space-between;border:2px solid rgba(255,255,255,.16)}
.slide-stage.theme-royal{background:linear-gradient(135deg,#0f172a,#1e3a8a,#172554);color:#fff}
.slide-stage.theme-emerald{background:linear-gradient(135deg,#022c22,#065f46,#064e3b);color:#fff}
.slide-stage.theme-sunset{background:linear-gradient(135deg,#27102c,#7c2d12,#451a03);color:#fff}
.slide-stage.theme-obsidian{background:linear-gradient(135deg,#09090b,#18181b,#27272a);color:#fafafa}
.slide-stage.theme-minimal{background:linear-gradient(135deg,#f8fafc,#e2e8f0);color:#0f172a;border-color:#cbd5e1}
.slide-stage:fullscreen{border-radius:0;padding:44px 56px;width:100vw;height:100vh}
.sl-top{display:flex;justify-content:space-between;align-items:center}
.sl-badge{padding:4px 11px;border-radius:999px;font-size:12px;font-weight:bold;background:rgba(255,199,44,.2);color:#FFC72C;border:1px solid rgba(255,199,44,.45)}
.theme-minimal .sl-badge{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
.sl-title{font-size:24px;font-weight:bold;margin:12px 0 6px}
.slide-stage:fullscreen .sl-title{font-size:42px}
.sl-sub{font-size:15px;opacity:.85;margin-bottom:12px}
.sl-bullets{margin:6px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.sl-bullets li{background:rgba(255,255,255,.08);padding:10px 13px;border-radius:10px;border-left:4px solid #FFC72C;font-size:15px}
.theme-minimal .sl-bullets li{background:rgba(15,23,42,.06);border-left-color:#2563eb}
.sl-split{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
@media(max-width:680px){.sl-split{grid-template-columns:1fr}}
.sl-callout{background:rgba(255,199,44,.14);border:1px solid rgba(255,199,44,.45);border-radius:12px;padding:14px}
.theme-minimal .sl-callout{background:#dbeafe;border-color:#93c5fd;color:#1e3a8a}
.sl-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:8px 0}
.sl-statbox{background:rgba(255,255,255,.1);border-radius:12px;padding:12px;text-align:center}
.sl-statval{font-size:24px;font-weight:bold;color:#FFC72C}
.sl-quote{font-size:18px;font-style:italic;padding:15px;border-left:5px solid #FFC72C;background:rgba(255,255,255,.07);border-radius:10px}
.sl-foot{display:flex;justify-content:space-between;font-size:12px;opacity:.8;border-top:1px solid rgba(255,255,255,.15);padding-top:8px;margin-top:12px}
.theme-minimal .sl-foot{border-top-color:#cbd5e1}

/* KAHOOT & TABLES */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kbox{padding:14px;border-radius:12px;font-weight:bold;font-size:15px;display:flex;align-items:center;gap:10px}
.kbox.k0{background:#B91C1C}.kbox.k1{background:#1D4ED8}.kbox.k2{background:#B45309}.kbox.k3{background:#15803D}
.kbox.dim{opacity:.35}.kbox.ok{outline:4px solid #7CFC9A}
.barwrap{background:rgba(12,24,66,.9);border-radius:8px;overflow:hidden;height:22px;margin:5px 0;position:relative}
.barfill{background:#2563EB;height:100%}
.bartxt{position:absolute;left:10px;top:2px;font-size:12px;font-weight:bold}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 5px;border-bottom:1px solid rgba(27,49,128,.6);font-size:13px;text-align:left}
.modal{display:none;position:fixed;inset:0;background:rgba(3,7,22,.82);z-index:50;overflow-y:auto;padding:14px}
.modal .mbox{max-width:680px;margin:20px auto;background:#0e1a44;border:1px solid #3B82F6;border-radius:16px;padding:16px}
</style></head>
<body><div class="w">

<!-- PIN / XONA KIRISH -->
<div id="pinbox" class="card" style="max-width:440px;margin:30px auto;border:2px solid #FFC72C">
  <h2 style="color:#FFC72C;font-size:18px">⚡ BOSHLOVCHI PANELI</h2>
  <label style="font-size:13px;color:#93C5FD">Xona kodi (umumiy xona: 0000):</label>
  <input id="inroom" value="0000">
  <label style="font-size:13px;color:#93C5FD">Boshlovchi PIN kodi:</label>
  <input id="inpin" type="password" placeholder="PIN (masalan: 1234)">
  <div style="display:flex;gap:8px;margin-top:8px">
    <button class="gold" style="flex:1" onclick="authRoom()">Kirish</button>
    <button class="green" style="flex:1" onclick="createNewRoom()">+ Yangi Xona</button>
  </div>
  <div id="pinmsg" style="color:#FF8A80;font-size:13px;margin-top:6px"></div>
</div>

<!-- ASOSIY ADMIN PANEL -->
<div id="admbox" style="display:none">
  <div class="topbar">
    <div class="brand">
      <span>⚡ JEO QUIZ PRO</span>
      <span id="toproom" class="pill">#0000</span>
      <span id="topai" class="aipill">AI</span>
    </div>
    <div class="topacts">
      <button class="gold" onclick="setView('hub')">🏠 Bosh Menyu</button>
      <button onclick="setView('play')">▶️ Joriy Rejim</button>
      <button onclick="toggleDrawer()">⚙️ Sozlamalar ▾</button>
    </div>
  </div>

  <!-- YIG'ILUVCHAN SOZLAMALAR MENYUSI -->
  <div id="topdrawer" class="drawer">
    <button onclick="openModal('qrmodal')">📲 QR-kod va PIN</button>
    <button onclick="openModal('presetmodal')">📚 Tayyor mavzular</button>
    <button onclick="openModal('aimodal')">🤖 AI Savol tuzish</button>
    <button onclick="openEditModal()">✏️ 25 Savolni tahrirlash</button>
    <button onclick="openTeamsModal()">👥 Jamoalar va Ballar</button>
    <button class="red" onclick="switchRoom()">🚪 Xonani almashtirish</button>
  </div>

  <div id="aibanner" class="aibox" style="display:none;margin-bottom:10px"></div>
  <div id="scorestrip" class="scorestrip"></div>
  <div id="hubstage" style="display:none"></div>
  <div id="playstage"></div>
</div>

<!-- MODALLAR (2B-QISMDA TO'LDIRILADI) -->
<div id="qrmodal" class="modal" onclick="if(event.target===this)closeModal('qrmodal')"><div class="mbox" id="qrmodalbody"></div></div>
<div id="presetmodal" class="modal" onclick="if(event.target===this)closeModal('presetmodal')"><div class="mbox" id="presetmodalbody"></div></div>
<div id="aimodal" class="modal" onclick="if(event.target===this)closeModal('aimodal')"><div class="mbox" id="aimodalbody"></div></div>
<div id="editmodal" class="modal" onclick="if(event.target===this)closeModal('editmodal')"><div class="mbox" id="editmodalbody"></div></div>
<div id="teamsmodal" class="modal" onclick="if(event.target===this)closeModal('teamsmodal')"><div class="mbox" id="teamsmodalbody"></div></div>

</div>
<script>
const L = ['A','B','C','D'];
const SHAPES = ['▲','◆','●','■'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ru-RU');

const up = new URLSearchParams(window.location.search);
let curRoom = up.get('room') || sessionStorage.getItem('adm_room') || '0000';
let curPin = up.get('pin') || sessionStorage.getItem('adm_pin') || '';
let S = null;
let curView = 'hub';
let slideEditOpen = false;
let lastSlideKey = '';

document.getElementById('inroom').value = curRoom;
if (curPin) document.getElementById('inpin').value = curPin;

function toggleDrawer(){ document.getElementById('topdrawer').classList.toggle('open'); }
function openModal(id){ document.getElementById('topdrawer').classList.remove('open'); document.getElementById(id).style.display='block'; renderModals(); }
function closeModal(id){ document.getElementById(id).style.display='none'; }

function setView(v){
  curView = v;
  document.getElementById('topdrawer').classList.remove('open');
  render();
}

async function apiAdmin(payload){
  const r = await fetch('/api/admin', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({room: curRoom, pin: curPin, ...payload})
  });
  const j = await r.json();
  if (!r.ok){ alert(j.error || 'Xatolik'); return null; }
  S = j;
  render();
  return j;
}

async function selectMode(mode){
  curView = 'play';
  await apiAdmin({action: 'set_mode', mode});
}

/* === PRO SLAYD STUDIO === */
function renderSlidesAdmin(){
  const stg = document.getElementById('playstage');
  const sd = S.slides;
  let h = `<div class="card">
    <h2>🎨 PRO SLAYD STUDIO — AI TAQDIMOT YARATISH</h2>
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px">
      <input id="sltopic" placeholder="Mavzu (masalan: Buxgalteriya hisobi)" value="${esc(S.topic_title || '')}">
      <select id="slcount">
        <option value="6">6 ta slayd</option>
        <option value="8" selected>8 ta slayd</option>
        <option value="12">12 ta slayd</option>
      </select>
      <select id="slstyle">
        <option value="Akademik ma’ruza">🎓 Akademik ma’ruza</option>
        <option value="Biznes pitch / Tahlil">💼 Biznes pitch / Tahlil</option>
        <option value="Qisqa konspekt">⚡ Qisqa konspekt</option>
      </select>
      <select id="sltheme" onchange="if(S.slides) apiAdmin({action:'slides_theme', theme:this.value})">
        <option value="royal" ${sd?.theme==='royal'?'selected':''}>🔵 Royal Navy</option>
        <option value="emerald" ${sd?.theme==='emerald'?'selected':''}>🟢 Emerald Green</option>
        <option value="sunset" ${sd?.theme==='sunset'?'selected':''}>🟠 Sunset Gold</option>
        <option value="obsidian" ${sd?.theme==='obsidian'?'selected':''}>⚫ Obsidian Dark</option>
        <option value="minimal" ${sd?.theme==='minimal'?'selected':''}>⚪ Minimal Light</option>
      </select>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px">
      <input id="slfile" type="file" accept=".pdf,.docx,.txt,.md,image/*" style="max-width:250px">
      <button class="purple" ${S.ai_busy?'disabled':''} onclick="genAiSlides()">✨ Gemini AI Slayd Yaratish</button>
      <button class="gold" onclick="apiAdmin({action:'slides_from_questions', theme:document.getElementById('sltheme').value})">📊 Mavjud 25 savoldan slayd</button>
    </div>
  </div>`;

  if (!sd || !sd.items || !sd.items.length){
    stg.innerHTML = h;
    return;
  }

  const idx = Math.max(0, Math.min(sd.items.length - 1, sd.cur_idx || 0));
  const sl = sd.items[idx];
  const total = sd.items.length;
  const thClass = 'theme-' + (sd.theme || 'royal');
  const layout = sl.layout || 'bullets';

  let bodyHtml = '';
  if (layout === 'stats' && sl.stats && sl.stats.length){
    bodyHtml += `<div class="sl-stats">` + sl.stats.map(st =>
      `<div class="sl-statbox"><div class="sl-statval">${esc(st.value)}</div><div class="sl-statlbl">${esc(st.label)}</div></div>`
    ).join('') + `</div>`;
  }
  if (layout === 'quote'){
    bodyHtml += `<div class="sl-quote">«${esc(sl.highlight || sl.subtitle || sl.title)}»</div>`;
  } else if (layout === 'split'){
    bodyHtml += `<div class="sl-split">
      <ul class="sl-bullets">` + (sl.bullets || []).map(b => `<li>▸ ${esc(b)}</li>`).join('') + `</ul>
      <div class="sl-callout"><b>💡 Asosiy Xulosa:</b><div style="margin-top:6px">${esc(sl.highlight || sl.subtitle || '')}</div></div>
    </div>`;
  } else if (sl.bullets && sl.bullets.length){
    bodyHtml += `<ul class="sl-bullets">` + sl.bullets.map(b => `<li>▸ ${esc(b)}</li>`).join('') + `</ul>`;
  }

  h += `<div class="card">
    <div id="admslidestage" class="slide-stage ${thClass}">
      <div>
        <div class="sl-top">
          <span class="sl-badge">${esc(sl.badge || `${idx+1}-SLAYD`)}</span>
          <span style="font-size:13px;font-weight:bold">${idx + 1} / ${total}</span>
        </div>
        <div class="sl-title">${esc(sl.title)}</div>
        ${sl.subtitle ? `<div class="sl-sub">${esc(sl.subtitle)}</div>` : ''}
        ${bodyHtml}
      </div>
      <div class="sl-foot">
        <span>${esc(sd.title)}</span>
        <span>Jeo Quiz</span>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px">
      <div style="display:flex;gap:6px">
        <button ${idx<=0?'disabled':''} onclick="apiAdmin({action:'slides_nav', idx:${idx-1}})">◀ Oldingi</button>
        <button class="gold" ${idx>=total-1?'disabled':''} onclick="apiAdmin({action:'slides_nav', idx:${idx+1}})">Keyingi ▶</button>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button onclick="document.getElementById('admslidestage').requestFullscreen?.()">🖥️ To‘liq ekran</button>
        <button onclick="slideEditOpen=!slideEditOpen;renderSlidesAdmin()">✏️ Tahrirlash</button>
        <button class="green" onclick="apiAdmin({action:'slides_add_item'})">+ Slayd</button>
        <button class="red" ${total<=1?'disabled':''} onclick="apiAdmin({action:'slides_delete_item', idx:${idx}})">🗑</button>
      </div>
    </div>
    ${sl.notes ? `<div class="aibox"><b>🎙 Spiker eslatmasi:</b> ${esc(sl.notes)}</div>` : ''}
  </div>`;

  if (slideEditOpen){
    h += `<div class="card" style="border:1px solid #FFC72C">
      <h2>✏️ ${idx+1}-SLAYDNI TAHRIRLASH</h2>
      <input id="edsl_title" value="${esc(sl.title)}" placeholder="Sarlavha">
      <input id="edsl_sub" value="${esc(sl.subtitle)}" placeholder="Taglavha">
      <textarea id="edsl_bul" rows="4" placeholder="Har bir punkt yangi qatordan">${esc((sl.bullets||[]).join('\n'))}</textarea>
      <input id="edsl_hi" value="${esc(sl.highlight)}" placeholder="Asosiy xulosa">
      <button class="gold" onclick="saveSlideItem(${idx})">💾 Saqlash</button>
    </div>`;
  }
  stg.innerHTML = h;
}

async function genAiSlides(){
  const topic = document.getElementById('sltopic').value.trim() || S.topic_title || 'Taqdimot';
  const slide_count = Number(document.getElementById('slcount').value || 8);
  const style = document.getElementById('slstyle').value;
  const theme = document.getElementById('sltheme').value;
  const fInp = document.getElementById('slfile');
  let payload = {action: 'ai_generate_slides', topic, slide_count, style, theme};
  if (fInp && fInp.files && fInp.files[0]){
    const file = fInp.files[0];
    const b64 = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(String(fr.result).split(',')[1] || '');
      fr.onerror = rej;
      fr.readAsDataURL(file);
    });
    payload.filename = file.name;
    payload.mime = file.type;
    payload.data_b64 = b64;
  }
  await apiAdmin(payload);
}

async function saveSlideItem(idx){
  const cur = S.slides.items[idx];
  const bullets = document.getElementById('edsl_bul').value.split('\n').map(s=>s.trim()).filter(Boolean);
  await apiAdmin({
    action: 'slides_save_item', idx,
    slide: {
      layout: cur.layout, badge: cur.badge,
      title: document.getElementById('edsl_title').value.trim(),
      subtitle: document.getElementById('edsl_sub').value.trim(),
      bullets, highlight: document.getElementById('edsl_hi').value.trim(),
      stats: cur.stats || [], notes: cur.notes || ''
    }
  });
  slideEditOpen = false;
}
/* === ODDIY TEST (CLASSIC TEST) === */
function renderClassicTestAdmin(){
  const stg = document.getElementById('playstage');
  const ct = S.classic_test;
  let h = `<div class="card">
    <h2>📝 ODDIY TEST — MUSTAQIL YECHISH REJIMI</h2>
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px">
      <input id="cttitle" value="${esc(ct?.title || S.topic_title || 'Oddiy Test')}" placeholder="Test nomi">
      <select id="ctcnt">
        <option value="10">10 ta savol</option>
        <option value="15">15 ta savol</option>
        <option value="25" selected>25 ta savol</option>
      </select>
      <select id="cttime">
        <option value="0" selected>Vaqtsiz</option>
        <option value="10">10 daqiqa</option>
        <option value="20">20 daqiqa</option>
        <option value="30">30 daqiqa</option>
      </select>
    </div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px">
      <label style="font-size:13px"><input id="ctshuf" type="checkbox" style="width:auto"> Aralashtirish</label>
      <label style="font-size:13px"><input id="ctexp" type="checkbox" checked style="width:auto"> Izohlarni ko‘rsatish</label>
      <button class="green" onclick="startClassicTest()">▶ Testni boshlash</button>
    </div>
  </div>`;

  if (ct){
    const subs = ct.submissions_list || [];
    h += `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">

async function genAiBoard(){
  const topic = document.getElementById('aitopic').value.trim();
  if (!topic) return alert('Mavzu kiriting');
  closeModal('aimodal');
  await apiAdmin({action:'ai_generate_board', topic, level: document.getElementById('ailevel').value});
}

async function genAiBoardFile(){
  const f = document.getElementById('aifile').files[0];
  if (!f) return alert('Fayl tanlang');
  const b64 = await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(',')[1] || '');
    fr.onerror = rej;
    fr.readAsDataURL(f);
  });
  closeModal('aimodal');
  await apiAdmin({action:'ai_generate_from_file', filename: f.name, mime: f.type, data_b64: b64, hint: document.getElementById('aitopic').value.trim()});
}

/* === ASOSIY RENDER VA AUTH === */
function render(){
  if (!S) return;
  document.getElementById('toproom').textContent = '#' + S.room;
  document.getElementById('topai').textContent = S.ai_ready ? 'AI: Faol' : 'AI: Yo‘q';

  const ban = document.getElementById('aibanner');
  if (S.ai_error){
    ban.style.display = 'block'; ban.style.borderLeftColor = '#EF4444'; ban.style.color = '#FF8A80';
    ban.textContent = 'Xato: ' + S.ai_error;
  } else if (S.ai_status){
    ban.style.display = 'block'; ban.style.borderLeftColor = '#10B981'; ban.style.color = '#7CFC9A';
    ban.textContent = S.ai_status;
  } else {
    ban.style.display = 'none';
  }

  const strip = document.getElementById('scorestrip');
  if (S.mode === 'slides' || S.mode === 'classic_test'){
    strip.style.display = 'none';
  } else {
    strip.style.display = 'grid';
    strip.innerHTML = S.teams.map((t, i) => `<div class="scmini"><div class="t">${esc(t)}</div><div class="v">${S.scores[i]}</div></div>`).join('');
  }

  if (curView === 'hub'){
    document.getElementById('hubstage').style.display = 'block';
    document.getElementById('playstage').style.display = 'none';
    renderHub();
  } else {
    document.getElementById('hubstage').style.display = 'none';
    document.getElementById('playstage').style.display = 'block';
    const m = S.mode || 'jeopardy';
    if (m === 'slides') renderSlidesAdmin();
    else if (m === 'classic_test') renderClassicTestAdmin();
    else if (m === 'millionaire') renderMillionaireAdmin();
    else if (m === 'auction') renderAuctionAdmin();
    else if (m === 'bomb') renderBombAdmin();
    else if (m === 'kahoot') renderKahootAdmin();
    else renderJeopardyAdmin();
  }
}

async function authRoom(){
  const room = document.getElementById('inroom').value.trim() || '0000';
  const pin = document.getElementById('inpin').value.trim();
  const r = await fetch(`/api/state?room=${encodeURIComponent(room)}&admin=1&pin=${encodeURIComponent(pin)}`);
  const j = await r.json();
  if (!r.ok){ document.getElementById('pinmsg').textContent = j.error || 'Xato PIN'; return; }
  curRoom = room; curPin = pin; S = j;
  sessionStorage.setItem('adm_room', curRoom);
  sessionStorage.setItem('adm_pin', curPin);
  document.getElementById('pinbox').style.display = 'none';
  document.getElementById('admbox').style.display = 'block';
  render();
}

async function createNewRoom(){
  const r = await fetch('/api/create_room', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
  const j = await r.json();
  if (!r.ok) return;
  curRoom = j.room; curPin = j.pin; S = j.state;
  sessionStorage.setItem('adm_room', curRoom);
  sessionStorage.setItem('adm_pin', curPin);
  document.getElementById('pinbox').style.display = 'none';
  document.getElementById('admbox').style.display = 'block';
  render();
  openModal('qrmodal');
}

function switchRoom(){
  curPin = '';
  sessionStorage.removeItem('adm_pin');
  document.getElementById('admbox').style.display = 'none';
  document.getElementById('pinbox').style.display = 'block';
}

async function poll(){
  if (!curPin || document.getElementById('admbox').style.display === 'none') return;
  if (document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
  try {
    const r = await fetch(`/api/state?room=${encodeURIComponent(curRoom)}&admin=1&pin=${encodeURIComponent(curPin)}`);
    if (r.ok){ S = await r.json(); render(); }
  } catch(e){}
}

if (curPin) authRoom();
setInterval(poll, 1100);
</script>
